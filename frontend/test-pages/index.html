    <p>
      はじめに
      　１９８４年🐱、私は社会人になりました。日経平均が一万円を超えたというニュースと、「グリコ・森永事件」の不穏な空気が、同じ春の新聞に並んでいたのを覚えています。明るさと不安が、ひとつの時代の中でゆらゆらと混じり合っていました。
      それから三十年ほど、私たち夫婦の毎日は、外では「仕事」、家では「子供中心」という二つの流れの中にありました。
      　旅には、季節ごとに出かけていました。楽しい時間でした。けれども今になって思うのです。あの頃の旅には、ほんのわずかな違和感のようなものが、「働くための気分転換」、「子供たちに経験を」。
      　旅の理由がいつも自分たちの外側にあったからかもしれません。
      <!-- 五十にして天命を知る!?
      　『論語』に、そんな言葉があります。五十歳という年齢は、人が自分の役割を静かに見つめはじめる頃なのだと、昔の人は考えたようです。
      　２０１０年、末の娘が家を出て、妻と二人の暮らしが始まりました。私たちも五十代になっていました。気がつくと、時間も、収入も、気持ちの向け先も、「子供」から「夫婦」へと、ゆっくり流れを変えていました。世の中は「働き方改革」へと動き、会社の空気もやわらいで、連続した休みも取りやすくなっていました。
      　「人生で何をなすべきか」。そう問うてみたとき、二人の答えは驚くほど素朴でした。「夫婦の時間を大切にする」。音楽も、絵も、おいしいものも、二人とも好きです。けれども旅は、その中でも少し特別な場所にありました。
      どうして旅が好きなのか
      　私も妻も、大学を出るまで大阪で育ちました。子供の頃の世界は大阪府の中。高校生になると近畿へ、大学生になって、ようやく三百キロの範囲まで。それが、ほとんど世界のすべてでした。
      　就職で愛知東部に移り住んだとき、ふっと、自分の根っこが土から抜けたような感覚がありました。不思議なことに、心細さよりも、どこか軽やかな気持ちのほうが勝っていました。世界は国内へ広がり、仕事で海外へ出るようになると、さらに遠くまで広がっていきました。
      　もっと知りたい、この国のことを、そして遠い国のことを。
      　そんな気持ちが、いつのまにか私たちを旅へと向かわせていたのだと思います。
      旅のスタイル 　旅のきまりは、ささやかなものです。
      　国内の旅は、金曜日に出発して、月曜日に帰ります。月曜日は有給休暇をいただきます。
      　泊まるのは一か所か二か所まで。荷物はできるだけ動かさずにいたい。宿はビジネスホテルです。眠るための静かな部屋があれば、それで十分で、そのぶん、土地の食べものに心を向けたいのです。
      　昼は、その土地の名物を。
      　夜は、ネットで探した地元のおいしい店で。そして、街の中を歩きます。そこに暮らす人々の空気を、少しでも感じてみたくて。
      　海外の旅は、土曜日に発って、翌週の土曜日に帰ります。日曜日は、からだを休めるための日です。
      　飛行機のチケットも、宿も、列車も、すべて自分たちで手配します。ただ、現地のツアーは有効利用します。時間を節約できるし、思わぬ危険も避けられるからです。
      　泊まるのは二か所まで。ここでも荷物は動かしません。
      　服装は普段着のままで、着飾ることはしません。宿を拠点にして、日帰りで周りの街を、場合によっては国をまたいで訪ねます。移動は基本的に列車、バスで、ときには飛行機に乗ることもあります。
      　語学はつたないものです。それでも、地元の人に話しかけます。うまく伝わらないことが多いのですが、コミュニケーションがとれた時に感じる、「人の温かさ」は、旅の中の宝物のようです。
      　食事は、地元のスーパーで買い出しをします。棚に並ぶものを眺めていると、その土地の毎日の暮らしが、ふと見えてくるのです。もちろん、名物料理もレストランで食べることもあります。お土産は、その土地のおいしいもの。
      特にチョコレートは欠かせません。 こんなふうに、私たちは旅をしています。
      おわりに
      　これから少しずつ、これまでの旅で出会った風景や、人や、時間のことを、書いていきたいと思います。
      最後まで読んでくださって、ありがとうございました。 -->
